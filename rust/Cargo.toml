# Rust part of the cross-language benchmark (see ../PROTOCOL.md).
# One binary crate per library, so that one library that does not build, or
# needs other dependency versions, does not break the others; `harness` is the
# shared timing loop and JSONL writer. Versions are pinned exactly (`=x.y.z`).
[workspace]
resolver = "3"
members = [
    "harness",
    "libs/en16931",
    "libs/einvoice-validator",
    "libs/erechnung-validator",
    "libs/core-invoice",
    "libs/zugferd-rs",
    "libs/factur-x",
    "libs/pdfa",
    "libs/pdf-invoice",
    "libs/zugferd",
    "libs/einvoice",
    "libs/lopdf",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
harness = { path = "harness" }

# Default release profile of Cargo, no CPU-specific options (PROTOCOL.md).
