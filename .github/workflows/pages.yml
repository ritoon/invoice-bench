name: Pages

# Publishes the results site (site/) on GitHub Pages. The site is rebuilt from
# the committed records whenever they or the site change on main.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'results/**'
      - 'go/results/**'
      - 'go/libs/*/go.mod'
      - 'cases/*.tsv'
      - 'cases/*.go'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Generate the data and copy the pages
        working-directory: site
        run: go run . -out ../_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
